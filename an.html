<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客室清掃依頼 | 土日・祝日/平日も対応</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 620px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 { text-align: center; color: #222; font-size: 28px; margin-bottom: 15px; }
    .note {
      color: #d32f2f;
      font-weight: bold;
      font-size: 17px;
      margin: 12px 0;
      text-align: left;
    }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #444;
    }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .date-range { display: flex; gap: 15px; }
    .date-range div { flex: 1; }
    .checkbox-group { margin-bottom: 25px; }
    .checkbox-group label {
      font-weight: normal;
      margin: 10px 0;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }
    button {
      background: #007bff;
      color: white;
      padding: 15px 40px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-top: 25px;
      font-weight: bold;
    }
    button:hover { background: #0069d9; }
    .checkbox-group input[type="checkbox"]:disabled + span {
      color: #999;
      cursor: not-allowed;
    }
    #totalDays {
      font-size: 17px;
      font-weight: bold;
      color: #0066cc;
      margin: 8px 0 20px;
      min-height: 28px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>客室清掃のご依頼</h1>
  <p class="note">土・日・祝日／平日も清掃希望を受け付けています</p>
  <p class="note">希望時間帯が混み合う場合は順次対応となります</p>
 
  <!-- Formspreeを使ったメール送信フォーム（d4hrc5842@gmail.com宛） -->
  <form action="https://formspree.io/f/xdkozjqa" method="POST">
    <label>部屋番号</label>
    <input type="text" name="room" required placeholder="例: 1205">

    <label>清掃指示期間</label>
    <div class="date-range">
      <div>
        <label style="font-size:15px; margin-top:0;">開始当日</label>
        <input type="date" id="date_from" name="date_from" required>
      </div>
      <div>
        <label style="font-size:15px; margin-top:0;">終了当日</label>
        <input type="date" id="date_to" name="date_to" required>
      </div>
    </div>
    <div id="totalDays"></div>
    <p style="font-size:14px; color:#666; margin-top:5px;">※連続した期間を指定できます（1日のみの場合は開始日＝終了日で入力ください）</p>
    <p style="font-size:14px; color:#666; margin-top:5px;">1日毎に清掃依頼が異なる場合は期間設定後「追加のご要望」へ記入ください</p>

    <label>希望時間帯</label>
    <select name="time" id="timeSelect" required>
      <option value="">選択してください</option>
      <option value="指定なし">指定なし（いつでもOK）</option>
      <option value="午前帰館①（10時～11時）">午前帰館①（10時～11時）</option>
      <option value="午前帰館②（11時～12時）">午前帰館②（11時～12時）</option>
      <option value="午後帰館③（12時～13時）">午後帰館③（12時～13時）</option>
      <option value="午後帰館④（13時～14時）">午後帰館④（13時～14時）</option>
      <option value="清掃なし詳細">清掃なし（詳細希望は下記より選択）</option>
      <option value="清掃なし全く">清掃なし（お部屋に入りません）</option>
    </select>

    <label>希望清掃内容（複数選択可）</label>
    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="type[]" value="通常清掃">
        <span>通常清掃（全て行います）</span>
      </label>
      <label>
        <input type="checkbox" name="type[]" value="タオル交換">
        <span>タオル交換（アメニティ＋浴衣）のみ</span>
      </label>
      <label>
        <input type="checkbox" name="type[]" value="ベッドメイク">
        <span>ベッドメイクのみ</span>
      </label>
      <label>
        <input type="checkbox" name="type[]" value="バスルーム">
        <span>バスルーム内清掃のみ</span>
      </label>
      <label>
        <input type="checkbox" name="type[]" value="ゴミ回収">
        <span>ゴミ回収のみ</span>
      </label>
      <label>
        <input type="checkbox" name="type[]" value="その他">
        <span>その他（追加要望に記入ください）</span>
      </label>
    </div>

    <label>追加のご要望</label>
    <textarea name="request" rows="5" placeholder="例: テーブル上は触らないでお願いします
例: 20日は11時に帰館、21日は12時帰館です"></textarea>

    <!-- 隠しフィールド（メール送信先を固定） -->
    <input type="hidden" name="_subject" value="客室清掃依頼が届きました">
    <input type="hidden" name="_next" value="https://あなたのGitHubページURL/thanks.html"> <!-- 送信後表示するお礼ページ（任意） -->
    <input type="hidden" name="_captcha" value="false">

    <button type="submit">送信する</button>
  </form>

  <script>
    // ---------- 既存の制御（時間帯・清掃内容） ----------
    const timeSelect = document.getElementById('timeSelect');
    const normalClean = document.getElementById('normalClean'); // IDがないので後で追加推奨
    // 他のチェックボックスも同様にIDを追加したい場合は教えてください

    function updateByTime() {
      const selected = timeSelect.value;
      const isNoClean = (selected === '清掃なし詳細' || selected === '清掃なし全く');
      // 通常清掃の制御（IDがないため簡易版）
      const normalCheck = document.querySelector('input[value="通常清掃"]');
      if (normalCheck) {
        normalCheck.disabled = isNoClean;
        if (isNoClean) normalCheck.checked = false;
      }
    }

    // ---------- 日数計算 ----------
    const dateFrom = document.getElementById('date_from');
    const dateTo = document.getElementById('date_to');
    const totalDaysDisplay = document.getElementById('totalDays');

    function calculateTotalDays() {
      if (!dateFrom.value || !dateTo.value) {
        totalDaysDisplay.textContent = '';
        return;
      }
      const from = new Date(dateFrom.value);
      const to = new Date(dateTo.value);
      if (to < from) {
        totalDaysDisplay.innerHTML = '<span style="color:#d32f2f;">※終了日は開始日以降にしてください</span>';
        return;
      }
      const diffTime = Math.abs(to - from);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      totalDaysDisplay.textContent = `【合計、${diffDays}日間】`;
    }

    // イベントリスナー
    timeSelect.addEventListener('change', updateByTime);
    dateFrom.addEventListener('change', calculateTotalDays);
    dateTo.addEventListener('change', calculateTotalDays);

    window.addEventListener('load', () => {
      updateByTime();
      calculateTotalDays();
    });
  </script>
</body>
</html>
