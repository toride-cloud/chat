<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客室清掃依頼 | 土日・祝日/平日も対応</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 620px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 { text-align: center; color: #222; font-size: 28px; margin-bottom: 15px; }
    .note {
      color: #d32f2f;
      font-weight: bold;
      font-size: 17px;
      margin: 12px 0;
      text-align: left;
    }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #444;
    }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .date-range { display: flex; gap: 15px; }
    .date-range div { flex: 1; }
    .checkbox-group { margin-bottom: 25px; }
    .checkbox-group label {
      font-weight: normal;
      margin: 10px 0;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }
    button {
      background: #007bff;
      color: white;
      padding: 15px 40px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-top: 25px;
      font-weight: bold;
    }
    button:hover { background: #0069d9; }
    button:disabled { background: #999; cursor: not-allowed; }
    .checkbox-group input[type="checkbox"]:disabled + span {
      color: #999;
      cursor: not-allowed;
    }
    #totalDays {
      font-size: 17px;
      font-weight: bold;
      color: #0066cc;
      margin: 8px 0 20px;
      min-height: 28px;
      text-align: left;
    }
    #successMessage {
      display: none;
      background: #d4edda;
      color: #155724;
      padding: 25px;
      border-radius: 8px;
      text-align: center;
      margin: 30px 0;
      font-size: 18px;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>

  <h1>客室清掃のご依頼</h1>
  <p class="note">土・日・祝日／平日も清掃希望を受け付けています</p>
  <p class="note">希望時間帯が混み合う場合は順次対応となります</p>

  <!-- ★ここだけ追加（送信先） -->
  <form id="cleaningForm"
    action="https://script.google.com/macros/s/AKfycbyJdKmjHl7TSYaZ-MHnxhTGUNaG53homewC_ipWynNIiC3hWbE8aN62f15dEkGkw09K3g/exec"
    method="POST"
    target="hidden_iframe">

    <label>部屋番号</label>
    <input type="text" name="room" required placeholder="例: 1205">

    <label>清掃指示期間</label>
    <div class="date-range">
      <div>
        <label style="font-size:15px; margin-top:0;">開始当日</label>
        <input type="date" id="date_from" name="date_from" required>
      </div>
      <div>
        <label style="font-size:15px; margin-top:0;">終了当日</label>
        <input type="date" id="date_to" name="date_to" required>
      </div>
    </div>
    <div id="totalDays"></div>

    <label>希望時間帯</label>
    <select name="time" id="timeSelect" required>
      <option value="">選択してください</option>
      <option value="指定なし">指定なし（いつでもOK）</option>
      <option value="午前帰館①（10時～11時）">午前帰館①（10時～11時）</option>
      <option value="午前帰館②（11時～12時）">午前帰館②（11時～12時）</option>
      <option value="午後帰館③（12時～13時）">午後帰館③（12時～13時）</option>
      <option value="午後帰館④（13時～14時）">午後帰館④（13時～14時）</option>
      <option value="清掃なし詳細">清掃なし（詳細希望は下記より選択）</option>
      <option value="清掃なし全く">清掃なし（お部屋に入りません）</option>
    </select>

    <label>希望清掃内容（複数選択可）</label>
    <div class="checkbox-group">
      <!-- ★ここ修正：type[] → type -->
      <label><input type="checkbox" name="type" id="normalClean" value="通常清掃"><span>通常清掃</span></label>
      <label><input type="checkbox" name="type" id="towel" value="タオル交換"><span>タオル交換</span></label>
      <label><input type="checkbox" name="type" id="bed" value="ベッドメイク"><span>ベッドメイク</span></label>
      <label><input type="checkbox" name="type" id="bath" value="バスルーム"><span>バスルーム</span></label>
      <label><input type="checkbox" name="type" id="garbage" value="ゴミ回収"><span>ゴミ回収</span></label>
      <label><input type="checkbox" name="type" id="other" value="その他"><span>その他</span></label>
    </div>

    <label>追加のご要望</label>
    <textarea name="request" rows="5"></textarea>

    <button type="submit">送信する</button>
  </form>

  <!-- ★追加 -->
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <div id="successMessage">
    ✅ 送信完了しました
  </div>

<script>
const form = document.getElementById('cleaningForm');
const successMessage = document.getElementById('successMessage');

form.addEventListener('submit', function() {
  const button = form.querySelector('button');
  button.disabled = true;
  button.textContent = '送信中...';

  setTimeout(() => {
    form.reset();
    successMessage.style.display = 'block';
    button.disabled = false;
    button.textContent = '送信する';
  }, 1500);
});
</script>

</body>
</html>
