<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客室清掃依頼 | 土日・祝日/平日も対応</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 620px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 { text-align: center; color: #222; font-size: 28px; margin-bottom: 15px; }
    .note {
      color: #d32f2f;
      font-weight: bold;
      font-size: 17px;
      margin: 12px 0;
      text-align: left;
    }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #444;
    }
    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .date-range { display: flex; gap: 15px; }
    .date-range div { flex: 1; }
    .checkbox-group { margin-bottom: 25px; }
    .checkbox-group label {
      font-weight: normal;
      margin: 10px 0;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 10px;
      transform: scale(1.2);
    }
    button {
      background: #007bff;
      color: white;
      padding: 15px 40px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-top: 25px;
      font-weight: bold;
    }
    button:hover { background: #0069d9; }
    button:disabled { background: #999; cursor: not-allowed; }
    .checkbox-group input[type="checkbox"]:disabled + span {
      color: #999;
      cursor: not-allowed;
    }
    #totalDays {
      font-size: 17px;
      font-weight: bold;
      color: #0066cc;
      margin: 8px 0 20px;
      min-height: 28px;
      text-align: left;
    }
    #successMessage {
      display: none;
      background: #d4edda;
      color: #155724;
      padding: 25px;
      border-radius: 8px;
      text-align: center;
      margin: 30px 0;
      font-size: 18px;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>
  <h1>客室清掃のご依頼</h1>
  <p class="note">土・日・祝日／平日も清掃希望を受け付けています</p>
  <p class="note">希望時間帯が混み合う場合は順次対応となります</p>

  <form id="cleaningForm">
    <label>部屋番号</label>
    <input type="text" name="room" required placeholder="例: 1205">

    <label>清掃指示期間</label>
    <div class="date-range">
      <div>
        <label style="font-size:15px; margin-top:0;">開始当日</label>
        <input type="date" id="date_from" name="date_from" required>
      </div>
      <div>
        <label style="font-size:15px; margin-top:0;">終了当日</label>
        <input type="date" id="date_to" name="date_to" required>
      </div>
    </div>
    <div id="totalDays"></div>

    <p style="font-size:14px; color:#666; margin-top:5px;">※連続した期間を指定できます（1日のみの場合は開始日＝終了日で入力ください）</p>
    <p style="font-size:14px; color:#666; margin-top:5px;">1日毎に清掃依頼が異なる場合は期間設定後<追加のご要望>へ記入ください</p>

    <label>希望時間帯</label>
    <select name="time" id="timeSelect" required>
      <option value="">選択してください</option>
      <option value="指定なし">指定なし（いつでもOK）</option>
      <option value="午前帰館①（10時～11時）">午前帰館①（10時～11時）</option>
      <option value="午前帰館②（11時～12時）">午前帰館②（11時～12時）</option>
      <option value="午後帰館③（12時～13時）">午後帰館③（12時～13時）</option>
      <option value="午後帰館④（13時～14時）">午後帰館④（13時～14時）</option>
      <option value="清掃なし詳細">清掃なし（詳細希望は下記より選択）</option>
      <option value="清掃なし全く">清掃なし（お部屋に入りません）</option>
    </select>

    <label>希望清掃内容（複数選択可）</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="type[]" id="normalClean" value="通常清掃"><span>通常清掃（全て行います）</span></label>
      <label><input type="checkbox" name="type[]" id="towel" value="タオル交換"><span>タオル交換（アメニティ＋浴衣）のみ</span></label>
      <label><input type="checkbox" name="type[]" id="bed" value="ベッドメイク"><span>ベッドメイクのみ</span></label>
      <label><input type="checkbox" name="type[]" id="bath" value="バスルーム"><span>バスルーム内清掃のみ</span></label>
      <label><input type="checkbox" name="type[]" id="garbage" value="ゴミ回収"><span>ゴミ回収のみ</span></label>
      <label><input type="checkbox" name="type[]" id="other" value="その他"><span>その他（追加要望に記入ください）</span></label>
    </div>

    <label>追加のご要望</label>
    <textarea name="request" rows="5" placeholder="例: テーブル上は触らないでお願いします
例: 20日は11時に帰館、21日は12時帰館です"></textarea>

    <!-- 送信先設定（formsubmit.co） -->
    <input type="hidden" name="_subject" value="【客室清掃依頼】新規ご依頼がありました">
    <input type="hidden" name="_captcha" value="false">

    <button type="submit">送信する</button>
  </form>

  <!-- 送信完了メッセージ -->
  <div id="successMessage">
    ✅ <strong>送信完了しました！</strong><br>
    ご依頼ありがとうございます。<br>
    清掃スタッフが確認次第、対応いたします。
  </div>

  <script>
    
    const timeSelect = document.getElementById('timeSelect');
    const normalClean = document.getElementById('normalClean');
    const towel = document.getElementById('towel');
    const bed = document.getElementById('bed');
    const bath = document.getElementById('bath');
    const garbage = document.getElementById('garbage');
    const other = document.getElementById('other');
    const dateFrom = document.getElementById('date_from');
    const dateTo = document.getElementById('date_to');
    const totalDaysDisplay = document.getElementById('totalDays');

    function updateByTime() {
      const selected = timeSelect.value;
      const isNoClean = (selected === '清掃なし詳細' || selected === '清掃なし全く');
      if (isNoClean) {
        normalClean.disabled = true;
        normalClean.checked = false;
      } else {
        normalClean.disabled = false;
      }
    }

    function updateByNormalClean() {
      const isNormalChecked = normalClean.checked;
      const partials = [towel, bed, bath, garbage];
      partials.forEach(item => {
        if (isNormalChecked) {
          item.disabled = true;
          item.checked = false;
        } else {
          item.disabled = false;
        }
      });
    }

    function calculateTotalDays() {
      if (!dateFrom.value || !dateTo.value) {
        totalDaysDisplay.textContent = '';
        return;
      }
      const from = new Date(dateFrom.value);
      const to = new Date(dateTo.value);
      if (to < from) {
        totalDaysDisplay.innerHTML = '<span style="color:#d32f2f;">※終了日は開始日以降にしてください</span>';
        return;
      }
      const diffTime = Math.abs(to - from);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      totalDaysDisplay.textContent = `【合計、${diffDays}日間】`;
    }

    
    const form = document.getElementById('cleaningForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const button = form.querySelector('button');
      const originalText = button.textContent;
      button.textContent = '送信中...';
      button.disabled = true;

      const formData = new FormData(form);

      try {
        const response = await fetch('https://formsubmit.co/esprit74221@gmail.com', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          form.reset();                    
          calculateTotalDays();            
          successMessage.style.display = 'block';
          window.scrollTo({ top: 0, behavior: 'smooth' }); 
        } else {
          alert('送信に失敗しました。もう一度お試しください。');
        }
      } catch (error) {
        alert('ネットワークエラーが発生しました。もう一度お試しください。');
      } finally {
        button.textContent = originalText;
        button.disabled = false;
      }
    });

    
    timeSelect.addEventListener('change', () => {
      updateByTime();
      if (normalClean.disabled) updateByNormalClean();
    });
    normalClean.addEventListener('change', updateByNormalClean);
    dateFrom.addEventListener('change', calculateTotalDays);
    dateTo.addEventListener('change', calculateTotalDays);

    window.addEventListener('load', () => {
      updateByTime();
      updateByNormalClean();
      calculateTotalDays();
    });
  </script>
</body>
</html>
